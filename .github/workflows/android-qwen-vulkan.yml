name: Qwen Vulkan Android debug

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Android variant to build
        type: choice
        options:
          - standalone
          - play
        default: standalone
        required: true

jobs:
  vulkan-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      FLAVOR: ${{ inputs.flavor }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Install pinned Vulkan build tools
        run: bash scripts/setup-vulkan-ci.sh
      - name: Build pinned TDLib JSONJava
        run: bash scripts/build-tdlib-jsonjava.sh
      - name: Build Vulkan debug APK
        run: |
          variant="${FLAVOR^}Debug"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PaiplayerVulkan=true \
            ":app:assemble$variant" ":app:test${variant}UnitTest"
      - name: Verify packaged Vulkan backend
        run: |
          apk="app/build/outputs/apk/$FLAVOR/debug/app-$FLAVOR-debug.apk"
          python3 - "$apk" <<'PY'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as apk:
              apk.getinfo("lib/arm64-v8a/libtdjsonjava.so")
              native = apk.read("lib/arm64-v8a/libaiplayer_context.so")
              if b"ggml_vulkan:" not in native:
                  raise SystemExit("Packaged Qwen library lacks the Vulkan backend")
          PY
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
      - name: Upload Vulkan debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-player-${{ inputs.flavor }}-vulkan-debug-${{ github.sha }}
          path: app/build/outputs/apk/${{ inputs.flavor }}/debug/app-${{ inputs.flavor }}-debug.apk
          if-no-files-found: error
          retention-days: 14
