name: Compact UI validation

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/compact-ui-validation.yml'
  workflow_dispatch:

jobs:
  android-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu Android runner already provides command-line SDK tools.
      # Avoid setup-android@v3 installing the obsolete 'tools' SDK package.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-ui-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/lint-results-*.html
