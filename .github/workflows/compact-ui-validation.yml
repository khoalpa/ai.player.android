name: Compact UI validation

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/compact-ui-validation.yml'
  workflow_dispatch:

jobs:
  android-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-ui-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/lint-results-*.html
