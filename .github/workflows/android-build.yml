name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub's Ubuntu Android runner already provides command-line SDK tools.
      # Avoid setup-android@v3 installing the obsolete 'tools' SDK package.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build pinned TDLib JSONJava and verify JNI bindings
        run: bash scripts/build-tdlib-jsonjava.sh
      - name: Check 16 KB Android ELF page alignment
        run: |
          python3 - <<'PY'
          import glob
          import subprocess
          libraries = glob.glob('app/src/main/jniLibs/*/libtdjsonjava.so')
          if not libraries:
              raise SystemExit('No native TDLib libraries to inspect')
          for path in libraries:
              output = subprocess.check_output(['readelf', '-lW', path], text=True)
              load_alignments = [int(line.split()[-1], 16) for line in output.splitlines()
                                 if line.lstrip().startswith('LOAD ')]
              if not load_alignments or any(value < 16384 for value in load_alignments):
                  raise SystemExit(f'{path}: not 16 KB ELF page aligned: {load_alignments}')
              print(f'{path}: verified 16 KB ELF alignment')
          PY
      - name: Build, unit tests and lint
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:assembleStandaloneDebug :app:testStandaloneDebugUnitTest :app:lintStandaloneDebug
          :app:assemblePlayDebug :app:testPlayDebugUnitTest :app:lintPlayDebug
      - name: Verify TDLib is packaged in the standard APK
        run: |
          for flavor in standalone play; do
            apk="app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            unzip -l "$apk" | grep -F 'lib/arm64-v8a/libtdjsonjava.so'
            "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
          done
      - name: Build unsigned release packages
        if: github.event_name == 'workflow_dispatch'
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:bundlePlayRelease :app:assembleStandaloneRelease
      - name: Upload unsigned release packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ai-player-unsigned-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            app/build/outputs/apk/standalone/release/app-standalone-release-unsigned.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-results
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/lint-results-*.*
            app/build/intermediates/lint_intermediate_text_report/**
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-player-debug-apk
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/*/debug/app-*-debug.apk
