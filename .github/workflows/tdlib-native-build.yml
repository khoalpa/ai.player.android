name: Verify official TDLib JSONJava native Android build

on:
  pull_request:
    paths:
      - 'scripts/build-tdlib-jsonjava.sh'
      - '.github/workflows/tdlib-native-build.yml'
  workflow_dispatch:

jobs:
  native-jsonjava:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/telegram-tdlib-session'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check official pinned TDLib source and build JSONJava
        run: bash scripts/build-tdlib-jsonjava.sh
      - name: Verify arm64-v8a and generated Java JNI bindings
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libtdjsonjava.so
          find app/src/main/jniLibs -type f -name 'libtdjsonjava.so' -print -exec sha256sum {} \;
      - name: Upload audited TDLib Android native candidates
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-jsonjava-native-candidate
          if-no-files-found: error
          retention-days: 14
          path: app/src/main/jniLibs/**/libtdjsonjava.so
